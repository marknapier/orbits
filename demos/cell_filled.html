<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cell with Hairs</title>
  <link rel="stylesheet" href="../styles/full_viewport_canvas.css">
  <style>
    body {
      background-color: rgb(98, 97, 97);
    }
  </style>
</head>

<body>
</body>

<script type="module">
  import PhysicsEngine from '../js/physics2D/PhysicsEngine.js';
  import Particle from '../js/physics2D/Particle.js';
  import Spring from '../js/physics2D/Spring.js';
  import Vector2D from '../js/physics2D/Vector2D.js';
  import RenderSimple from '../js/app/RenderSimple.js';
  import MouseHandler from '../js/app/MouseHandler.js';
  import AnimationLoop from '../js/app/AnimationLoop.js';
  import Page from '../js/app/Page.js';
  import ImageLoader from '../js/app/ImageLoader.js';

  class Wheel {
    constructor(engine, centerX, centerY, radius = 100, numParticles = 12) {
      this.engine = engine;
      this.centerX = centerX;
      this.centerY = centerY;
      this.radius = radius;
      this.numParticles = numParticles;
      this.centerParticle = null;
      this.outerParticles = [];
      this.centroid = { x: centerX, y: centerY }; // Initialize centroid to center of the wheel
      this.angle = 0; // rotation of the wheel, in radians
      this.build();
    }

    build() {
      // Create particles in a circle
      for (let i = 0; i < this.numParticles; i++) {
        const angle = (i / this.numParticles) * 2 * Math.PI;
        const x = this.centerX + this.radius * Math.cos(angle);
        const y = this.centerY + this.radius * Math.sin(angle);

        const particle = new Particle(
          `particle_${this.centerX}_${this.centerY}_${i}`,
          new Vector2D(x, y),
          new Vector2D(0, 0),
          new Vector2D(0, 0),
          3,  // mass
          10  // radius
        );
        particle.setColor('rgb(0, 100, 255)'); // Blue for outer particles
        particle.horiFriction = true; // Enable horizontal friction
        this.engine.addParticle(particle);
        this.outerParticles.push(particle);
      }

      // Create springs connecting consecutive outer particles (the ring)
      for (let i = 0; i < this.numParticles; i++) {
        const nextI = (i + 1) % this.numParticles;
        const spring = new Spring(
          this.outerParticles[i],
          this.outerParticles[nextI],
          5,      // spring constant
          1.9,    // damping
          this.radius * Math.sin(Math.PI / this.numParticles) * 2  // rest length (chord length)
        );
        this.engine.addSpring(spring);
      }

      this.rightParticle = this.outerParticles[0];
    }

    /**
     * Compute the centroid of the current particles.
     * @returns {{x:number,y:number}|null} coordinates of centroid or null if no particles
     */
    computeCentroid() {
      if (!this.outerParticles || this.outerParticles.length === 0) {
        return null;
      }
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      let cx = 0;
      let cy = 0;
      for (const p of this.outerParticles) {
        cx += p.pos.x;
        cy += p.pos.y;
        if (p.pos.x < minX) minX = p.pos.x;
        if (p.pos.y < minY) minY = p.pos.y;
        if (p.pos.x > maxX) maxX = p.pos.x;
        if (p.pos.y > maxY) maxY = p.pos.y;
      }
      cx /= this.outerParticles.length;
      cy /= this.outerParticles.length;
      return { x: cx, y: cy, minX, minY, maxX, maxY };
    }

    // Return angle between center of the wheel and a horizontal point on the right side of the wheel
    computeAngle() {
      const centroid = this.centroid;
      const markerPoint = this.rightParticle; // 0
      return this.angle = getAngle(centroid.x, centroid.y, markerPoint.pos.x, markerPoint.pos.y);
    }

    applyGlobalForces() {
      this.centroid = this.computeCentroid();
      if (!this.centroid) return;

      for (const p of this.outerParticles) {
        // Apply a force away from the centroid
        const toCentroid = new Vector2D(this.centroid.x - p.pos.x, this.centroid.y - p.pos.y);
        toCentroid.normalize();
        toCentroid.multiply(-20); // Adjust strength of the force
        p.force.x += toCentroid.x;
        p.force.y += toCentroid.y;
      }
    }
  }

  /**
   * Draw a smooth closed curve through the given points using quadratic Bezier curves.
   * Assumes that the points are ordered around the perimeter of the shape, and form a closed loop.
   * @param {CanvasRenderingContext2D} ctx - The canvas rendering context to draw on.
   * @param {Array<{x:number,y:number}>} points - An array of points to draw the curve through.
   */
  function drawQuadraticBezierCircle(ctx, points) {
    if (points.length < 2) return;

    const firstPoint = points[0];
    const lastPoint = points[points.length - 1];
    const startx = (firstPoint.x + lastPoint.x) / 2;  // average between first and last points in circle
    const starty = (firstPoint.y + lastPoint.y) / 2;

    ctx.fillStyle = 'rgba(50, 50, 60, 1)';
    ctx.strokeStyle = 'rgba(0, 150, 190, 1)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(startx, starty); // Start at the midpoint between the first and last point for a smoother curve

    for (let i = 0; i < points.length - 1; i++) {
      // Use midpoint as control point for smooth curve
      const xc = (points[i].x + points[i + 1].x) / 2;  // average between this point and the next point
      const yc = (points[i].y + points[i + 1].y) / 2;
      ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
    }

    // Curve ends at the initial midpoint
    ctx.quadraticCurveTo(lastPoint.x, lastPoint.y, startx, starty);
    ctx.fill();
  }

  // Draw a circle at each particle position
  function drawParticles(ctx, particles) {
    if (particles && particles.length > 0) {
      for (const particle of particles) {
        ctx.fillStyle = 'rgb(0, 255, 50)';
        ctx.beginPath();
        ctx.arc(particle.getX(), particle.getY(), 8, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawBoundingBox(ctx, wheel) {
    const centroid = wheel.centroid;
    ctx.strokeRect(centroid.minX, centroid.minY, centroid.maxX - centroid.minX, centroid.maxY - centroid.minY);
  }

  function getAngle(centerX, centerY, pointX, pointY) {
    return Math.atan2(pointY - centerY, pointX - centerX); // + (Math.PI / 2);
  }


  class RenderSmiley extends RenderSimple {
    constructor(sim, canvas, wheel1, smileyface) {
      super(sim, canvas);
      this.wheel1 = wheel1;
      this.smileyface = smileyface;
    }

    render() {
      this.wheel1.computeAngle();

      this.ctx.globalCompositeOperation = 'source-over';
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); // Clear the canvas before drawing

      drawQuadraticBezierCircle(this.ctx, this.wheel1.outerParticles.map(p => ({ x: p.pos.x, y: p.pos.y })));
      drawParticles(this.ctx, this.wheel1.outerParticles);

      // show the wheel angle as a text label near the wheel
      this.ctx.fillStyle = 'rgb(255, 255, 255)';
      this.ctx.font = '16px Arial';
      this.ctx.fillText(`Angle: ${this.wheel1.angle.toFixed(2)}`, this.wheel1.centroid.x + 10, this.wheel1.centroid.y - 200);

      // Use source-atop to draw the image only where the blob was drawn
      this.ctx.globalCompositeOperation = 'source-atop';

      const centroid = this.wheel1.centroid;
      if (centroid) {
        // get the blob default diameter
        const blobDiameter = this.wheel1.radius * 2;
        // Calculate the w and h to scale the image to the size of the stretched blob
        const blobW = centroid.maxX - centroid.minX;
        const blobH = centroid.maxY - centroid.minY;
        const scaleW = (blobW / blobDiameter) * 1.5; // Add some extra scaling to make the image larger than the blob
        const scaleH = (blobH / blobDiameter) * 1.5;

        this.ctx.save();
        {
          this.ctx.translate(centroid.x, centroid.y); // Move the origin to the centroid of the blob
          this.ctx.scale(scaleW, scaleH); // Scale the image to fit the blob's stretched size
          this.ctx.rotate(this.wheel1.angle); // Rotate the image based on this.wheel1.angle
          this.ctx.drawImage( // Draw the image centered on the blob
            this.smileyface,
            -this.wheel1.radius,
            -this.wheel1.radius,
            blobDiameter,
            blobDiameter
          );
        }
        this.ctx.restore();
      }
    }
  }

  async function loadAndRunSimulation() {
    try {
      const canvas = Page.createCanvas(window.innerWidth, window.innerHeight, 'sim');

      const engine = new PhysicsEngine();
      engine.setDimensions(canvas.width, canvas.height);
      engine.detectCollisions = true;
      engine.setWallTypeStr('absorbing');
      engine.gravY = 0.1;
      engine.wallFriction = 100.8;

      const wheel1 = new Wheel(engine, 200, 150, 100, 12);

      const smileyface = await ImageLoader.loadImage('../images/smiley_noborder.png');

      const renderer = new RenderSmiley(engine, canvas, wheel1, smileyface);

      const mouseHandler = new MouseHandler(canvas, engine, renderer);
      const animationLoop = new AnimationLoop(() => {
        engine.step(() => {
          wheel1.applyGlobalForces();
        });
        renderer.render();
      });
      animationLoop.start();

      console.log('Simulation started successfully!');
    } catch (error) {
      console.error('Failed to initialize simulation:', error);
    }
  }

  loadAndRunSimulation();
</script>

</html>
