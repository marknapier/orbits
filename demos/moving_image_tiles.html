<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Animated Pattern Generator</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: white;
    }

    canvas {
      display: block;
      border: 1px solid black;
    }
  </style>
</head>

<body>
</body>

<script type="module">
  import MovingImagePlaid from '../js/app/MovingImagePlaid.js';
  import Particle from '../js/physics2D/Particle.js';
  import Vector2D from '../js/physics2D/Vector2D.js';
  import Page from '../js/app/Page.js';

  function createCanvas(width, height) {
    const canvas = document.createElement('canvas');
    canvas.id = 'sim';
    canvas.width = width;
    canvas.height = height;
    document.body.appendChild(canvas);
    return canvas;
  }

  class RenderGridOfImages {
    constructor(particles, canvas) {
      this.particles = particles;
      this.canvas = canvas;
      this.bgColor = 'rgb(253, 253, 250)';
    }

    render() {
      const ctx = this.canvas.getContext('2d');
      ctx.fillStyle = this.bgColor;
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

      // Draw each particle's plaid image at its position
      for (const particle of this.particles) {
        this.paintParticle(ctx, particle);
      }
    }

    paintParticle(ctx, particle) {
      if (!particle || !particle.pos) return;
      const x = particle.getX();
      const y = particle.getY();
      // draw the static image
      ctx.drawImage(particle.plaidImage, x, y, 200, 200);
    }
  }

  function makePlaidImage(width, height) {
    const plaidImage = new MovingImagePlaid(width, height);
    plaidImage.step();
    return plaidImage.getCanvas();  // return the static canvas
  }

  async function loadAndRunSimulation() {
    try {
      const canvas = createCanvas(8000, 5000);

      // Testing limits of large canvas rendering:
      // Make a large grid of generated images and render into a large canvas.
      // I'm using particles to store grid positions - they won't be animated, 
      // just using them to hold x,y coordinates for the plaid images.
      const numPerRow = 40;
      const howMany = 1000;
      const particles = [];
      for (let i = 0; i < howMany; i++) {
        const posX = (i % numPerRow) * 200;
        const posY = Math.floor(i / numPerRow) * 200;

        particles.push(new Particle(
          'na',
          new Vector2D(posX, posY), // grid x,y position
          new Vector2D(0, 0),
          new Vector2D(0, 0),
          0, 
          0,
        ));

        // Add a plaid image to each particle for rendering
        particles[i].plaidImage = makePlaidImage(200, 200);
      }

      const renderer = new RenderGridOfImages(particles, canvas);
      
      // Render the tiled pattern once without animation
      renderer.render();

      // Add keyboard shortcut to save canvas as PNG
      document.addEventListener('keydown', async (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          Page.saveCanvasToPNG(canvas, 'tiled-plaid-pattern');
        }
      });

      console.log('Simulation started successfully!');
    } catch (error) {
      console.error('Failed to initialize simulation:', error);
    }
  }

  loadAndRunSimulation();
</script>

</html>
