<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Plaid effect</title>
  <style>
    body {
      margin: 100px;
      padding: 0;
      height: 100vh;
      /* display: flex; */
      justify-content: center;
      align-items: center;

    canvas {
      display: block;

<body>
</body>

<script type="module">
  import PhysicsEngine from '../js/physics2D/PhysicsEngine.js';
  import RendererSimple from '../js/app/RenderSimple.js';
  import MouseHandler from '../js/app/MouseHandler.js';
  import AnimationLoop from '../js/app/AnimationLoop.js';
  import MovingImagePlaid2 from '../js/app/MovingImagePlaid2.js';
  import MovingImageStripes from '../js/app/MovingImageStripes.js';
  import Particle from '../js/physics2D/Particle.js';
  import Vector2D from '../js/physics2D/Vector2D.js';

  function createCanvas(width, height) {
    const canvas = document.createElement('canvas');
    canvas.id = 'sim';
    canvas.width = width;
    canvas.height = height;
    document.body.appendChild(canvas);
    return canvas;
  }

  class RenderPlaid {
    constructor(target) {
      this.canvas = target;
      this.ctx = target.getContext('2d');
      this.width = target.width;
      this.height = target.height;

      const stripeConfig = [
        { // background stripe is full width, and has no oscWidth so it always fills full width
          widthBase: this.width,
          position: this.width / 2,
          darkColor: [25, 45, 22],
          lightColor: [220, 250, 250],
          oscColor: { frequency: 0.0025, type: 'sin', phase: Math.PI * 0.2 },
        },
        {
          widthBase: this.width * 0.25,
          widthDelta: this.width * 0.20,
          position: this.width * 0.25,
          darkColor: [70, 128, 132],
          lightColor: [192, 226, 228],
          oscWidth: { frequency: 0.003, type: 'sin', phase: 0 },
          oscColor: { frequency: 0.003, type: 'sin', phase: Math.PI * 0.7 },
          alpha: 0.65,
        },
        {
          widthBase: this.width * 0.20,
          widthDelta: this.width * 0.10,
          position: this.width * 0.25,
          darkColor: [255, 128, 132],
          lightColor: [255, 121, 13],
          oscWidth: { frequency: 0.0025, type: 'sin', phase: 0 },
          oscColor: { frequency: 0.0035, type: 'sin', phase: Math.PI * 0.8 },
          alpha: 0.65,
          alpha: 0.6,
        },
        {
          widthBase: this.width * 0.10,
          widthDelta: this.width * 0.08,
          position: this.width * 0.70,
          darkColor: [218, 188, 88],
          lightColor: [208, 200, 184],
          oscWidth: { frequency: 0.0075, type: 'cos', phase: 0 },
          oscColor: { frequency: 0.02, type: 'sin', phase: Math.PI * 1.3 },
          alpha: 0.65,
        },
        {
          widthBase: this.width * 0.10,
          widthDelta: this.width * 0.08,
          position: this.width * 0.80,
          darkColor: [218, 188, 88],
          lightColor: [208, 200, 184],
          oscWidth: { frequency: 0.0075, type: 'cos', phase: 0 },
          oscColor: { frequency: 0.02, type: 'sin', phase: Math.PI * 1.3 },
          alpha: 0.65,
    },
      ];

      const asdf = [
        { // background stripe is full width, and has no oscWidth so it always fills full width
          widthBase: this.width,
          position: this.width / 2,
          darkColor: [40, 10, 0], // red
          lightColor: [180, 60, 40],
          oscColor: { frequency: 0.025, type: 'sin', phase: Math.PI * 0.2 },
        },
        {
          widthBase: this.width * 0.33,
          widthDelta: this.width * 0.2,
          position: this.width * 0.33,
          darkColor: [10, 70, 30], // green
          lightColor: [30, 210, 55],
          oscWidth: { frequency: 0.008, type: 'sin', phase: 0 },
          oscColor: { frequency: 0.012, type: 'sin', phase: 0 },
          alpha: 0.65,
        },
        {
          widthBase: this.width * 0.1,
          widthDelta: this.width * 0.1,
          position: this.width * 0.75,
          darkColor: [200, 140, 10], // orange
          lightColor: [250, 200, 40],
          oscWidth: { frequency: 0.05, type: 'sin', phase: Math.PI * 1.5 },
          oscColor: { frequency: 0.03, type: 'sin', phase: Math.PI * 2.1 },
          alpha: 0.70,
        },
      ];
      this.movingImageStripes = new MovingImagePlaid2(this.width, this.height, stripeConfig);
      // this.movingImageStripes = new MovingImageStripes(this.width, this.height, stripeConfig);
    }

  render() {
    this.movingImageStripes.step();

    this.ctx.globalAlpha = 1.0;
    this.ctx.fillStyle = 'white';
    // this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    this.ctx.drawImage(this.movingImageStripes.canvas, 0, 0, this.canvas.width, this.canvas.height);
  }
  }

  function refreshFillCanvas(sourceImage, ctxToFill, width, height) {
    const pattern = ctxToFill.createPattern(sourceImage, 'repeat');
    ctxToFill.fillStyle = pattern;
    ctxToFill.fillRect(0, 0, width, height);
  }

  async function loadAndRunSimulation() {
    try {
      const canvas = createCanvas(480, 480);

      // Create off-screen canvas for couch with dots
      const fillCanvas = document.createElement('canvas');
      const ctxFillCanvas = fillCanvas.getContext('2d');
      fillCanvas.width = 1800;
      fillCanvas.height = 900;
      document.body.appendChild(fillCanvas); // debug

      const renderer = new RenderPlaid(canvas);
      const animationLoop = new AnimationLoop(() => {
        renderer.render();
        refreshFillCanvas(canvas, ctxFillCanvas, fillCanvas.width, fillCanvas.height);
      });
      animationLoop.start();

      console.log('String simulation started successfully!');
    } catch (error) {
      console.error('Failed to initialize simulation:', error);
    }
  }

  loadAndRunSimulation();
</script>

</html>
