<!doctype html>
<html>
<!--
 Draws dark and light circles to an offscreen canvas. Two slices of that canvas
are then drawn onto the display canvas, one with normal opacity and one with a hard-light composite for high contrast. 
-->

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cassini 2E 1 Moon 2</title>
  <link rel="stylesheet" href="./styles/full_viewport_canvas.css">
  <style>
    /* for debugging layout issues */
    body {
      transform: none;
      overflow: scroll;
    }

    body canvas {
      transform: none;
      position: relative;
    }
  </style>
</head>

<body>
  <button class="btn-back" onclick="history.back()" aria-label="Go back">&#8249;</button>
  <!-- Canvas will be inserted here -->
</body>

<script type="module">
  import PhysicsEngine from './js/physics2D/PhysicsEngine.js';
  import Vector2D from './js/physics2D/Vector2D.js';
  import MouseHandler from './js/app/MouseHandler.js';
  import AnimationLoop from './js/app/AnimationLoop.js';
  import Model from './js/app/Model.js';
  import Page from './js/app/Page.js'
  import Random from './js/app/Random.js';
  import Particle from './js/physics2D/Particle.js';
  import ColorPalette from './js/app/ColorPalette.js';
  import RenderSimple from './js/app/RenderSimple.js'

  const modelJSON = {
    "environment": {
      "wallType": "Reflecting",
      "wallFriction": 0.5,
      "gravityConstant": 9.0, // was 12.0
      "electricConstant": 0.0,
      "gravityFieldX": 0.0,
      "gravityFieldY": 0.0,
      "electricFieldX": 0.0,
      "electricFieldY": 0.0,
      "magneticFieldZ": 0.0,
      "airResistance": 0.10,
    },
    "particles": [
      {
        "particleNumber": 0,
        "label": "one",
        "color": "blue",
        "initialPositionX": 1,
        "initialPositionY": 100,
        "initialVelocityX": 0.0,
        "initialVelocityY": 0.0,
        "radius": 2.0, // was 26.0
        "mass": 50.0,
        "charge": 0.0,
        "fixedXPosition": false,
        "fixedYPosition": true, // change to false for more chaotic motion
        "trace": false
      },
      {
        "particleNumber": 1,
        "label": "two",
        "color": "orange",
        "initialPositionX": 380,
        "initialPositionY": 180,
        "initialVelocityX": 0.0,
        "initialVelocityY": 0.0,
        "radius": 6.0,
        "mass": 30.0,
        "charge": 0.0,
        "fixedXPosition": false,
        "fixedYPosition": false,
        "trace": true
      },
      {
        "particleNumber": 2,
        "label": "three",
        "color": "green",
        "initialPositionX": 600,
        "initialPositionY": 220,
        "initialVelocityX": 0.0,
        "initialVelocityY": 0.0,
        "radius": 8.0,
        "mass": 20.0,
        "charge": 0.0,
        "fixedXPosition": false,
        "fixedYPosition": true,
        "trace": true
      },
      {
        "particleNumber": 3,
        "label": "four",
        "color": "magenta",
        "initialPositionX": 700,
        "initialPositionY": 230,
        "initialVelocityX": 0.0,
        "initialVelocityY": 0.0,
        "radius": 2.0,
        "mass": 50.0,
        "charge": 0.0,
        "fixedXPosition": false,
        "fixedYPosition": false,
        "trace": true
      },
      {
        "particleNumber": 4,
        "label": "agitator",
        "color": "yellow",
        "initialPositionX": 600,
        "initialPositionY": 10,
        "initialVelocityX": 0.0,
        "initialVelocityY": 0.0,
        "radius": 10.0,
        "mass": 500.0,
        "charge": 0.0,
        "fixedXPosition": false,
        "fixedYPosition": false,
        "trace": true
      },
      // {
      //   "particleNumber": 5,
      //   "label": "tiny",
      //   "color": "black",
      //   "initialPositionX": 620,
      //   "initialPositionY": 10,
      //   "initialVelocityX": 0.0,
      //   "initialVelocityY": 0.0,
      //   "radius": 4.0,
      //   "mass": 2.0,
      //   "charge": 0.0,
      //   "fixedXPosition": false,
      //   "fixedYPosition": false,
      //   "trace": true
      // }
    ],
    "springs": [
      {
        "label": "spring2",
        "color": "white",
        "particle1": 1,
        "particle2": 2,
        "springConstant": 0.5,
        "damping": 0.8,
        "relaxedLength": 0
      },
      {
        "label": "spring3",
        "color": "white",
        "particle1": 1,
        "particle2": 3,
        "springConstant": 0.5,
        "damping": 0.8,
        "relaxedLength": 0
      },
      // {
      //   "label": "spring4", 
      //   "color": "white",
      //   "particle1": 1,
      //   "particle2": 4,
      //   "springConstant": 5.5,
      //   "damping": 0.8,
      //   "relaxedLength": 0
      // },
      // {
      //   "label": "spring4", // connects agitator to first particle in chain
      //   "color": "white",
      //   "particle1": 4,
      //   "particle2": 1,
      //   "springConstant": 5.5,
      //   "damping": 0.8,
      //   "relaxedLength": 0
      // },
    ]
  };

  export default class RenderVerticals extends RenderSimple {
    // Configurable options
    bgColor = "rgb(250,0,0)";          // background color
    opacity = 0.2;                      // alpha for all paint operations
    clearBG = false;                     // if false, leaves motion trails
    violetColors = ["rgb(2, 2, 10)", "rgb(10, 3, 20)", "rgb(15, 5, 15)", "rgb(5, 0, 9)"];

    constructor(sim, canvas) {
      super(sim, canvas);
      this.titanBlurPalette = null; // colors will be loaded in init()
      this.yellowGreenPalette = null;
      this.yellowOrangePalette = null;
      this.halfPI = Math.PI / 2;
      this.quarterPI = Math.PI / 4;

      // High-DPI monitors, such as Retina displays, can have 2 or 3 times the pixel density of standard displays. 
      // To ensure our canvas looks crisp on these displays, we scale it up proportionally to the device pixel ratio. 
      // (see Page.createCanvas()). Here we scale up the drawing context so that our drawing commands work in 
      // the original coordinate space, but render a larger image.
      this.dpiRatio = RenderSimple.getCanvasDPIRatio(this.canvas);

      //!!! get the screen to physics ratio
      this.canvasScreenSize = RenderSimple.getCanvasScreenSize(this.canvas);
      this.canvasScreenToSimRatioH = this.canvasScreenSize.height / sim.getHeight();

      // The final amount we'll scale by, including the DPI ratio and the screen-to-physics ratio.
      this.totalScale = this.dpiRatio * this.canvasScreenToSimRatioH;

      // Make an offscreen canvas for drawing - will be copied to display canvas in parts
      this.offscreenCanvas = Page.createOffscreenCanvasDPI(this.canvasScreenSize.width, this.canvasScreenSize.height, 'offscreen');
      if (false) {
        document.body.appendChild(this.offscreenCanvas); // debug - show the offscreen canvas on the page
      }

      // this.ctx will draw to the offscreen canvas.
      this.ctxDisplay = this.ctx; // save the on-screen context
      this.ctx = this.offscreenCanvas.getContext('2d'); // off screen context

      // Scale the offscreen context to fit the high pixel density and the screen-to-physics ratio.
      this.ctx.scale(this.totalScale, this.totalScale);

      // save some dimensions for later use
      this.simWidth = sim.getWidth();    // physics units, need to be scaled up to fit full-sized canvas
      this.simHeight = sim.getHeight();
      this.canvasH = this.offscreenCanvas.height;    // actual pixels, no need to scale when using these
      this.canvasW = this.offscreenCanvas.width;
    }

    setParticles(particles) {
      this.particles = particles ?? [];
    }

    async init() {
      this.titanBlurPalette = await ColorPalette.createFromImage('./images/titan_blur_gray.jpg');
      this.yellowGreenPalette = await ColorPalette.createFromImage('./images/yellow_green_gradient_hc.png');
      this.yellowOrangePalette = await ColorPalette.createFromImage('./images/yellow_orange_gradient.png');
    }

    // ============================================================
    // Render the physics simulation into the canvas
    render() {
      const ctx = this.ctx;
      const w = this.simWidth; // may be scaled for high-DPI canvas
      const h = this.simHeight; // may be scaled for high-DPI canvas

      // Clear bg if configured to do so, with a low alpha to create motion trails
      if (this.clearBG) {
        ctx.save();
        ctx.globalAlpha = 0.1;
        ctx.fillStyle = this.bgColor;
        ctx.fillRect(0, 0, this.simWidth, this.simHeight);
        ctx.restore();
      }

      // Set a constant alpha composite for subsequent drawing
      ctx.save();
      ctx.globalAlpha = this.opacity;

      const particles = this.particles;

      const p0 = particles[0]; // violet 0 - 1, 0 is fixed
      const p1 = particles[1]; // spring to 2
      const p2 = particles[2]; // spring to 3
      const p3 = particles[3];
      const p4 = particles[4]; // agitator
      // const p5 = particles[5]; // tiny

      const radius1 = Particle.distance(p0, p1);
      const radius2 = Particle.distance(p2, p4);
      // ------------------------------------------------------------------------------------------------
      // Draw a circle for each particle pair, using the distance between particles as the radius.
      // ------------------------------------------------------------------------------------------------

      // Dark violet circle p0 - p1
      // Make a 0-1 value that represents the radius length relative to the canvas height
      const radiusPercent = Math.max(Math.min(radius1 / Page.canvasScreenHeight, 1), 0.1);
      ctx.save();
      {
        ctx.globalAlpha = 0.1;
        ctx.strokeStyle = this.violetColors[(radiusPercent * 3) | 0];
        ctx.strokeStyle = 'rgba(250, 0, 200, 0.03)'; // red
        ctx.lineWidth = 15;
        this.blackCircleStats = this.drawArcPath(ctx, p0, p1);
        // ctx.fill();
        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = "rgba(250, 250, 0, 0.01)"; // yellow line through p0
        ctx.lineWidth = 4;
        this.drawLineV(p0.getX(), p0.getY());
      }
      ctx.restore();

      // draw a whitish grayish circle whose edges pass through p1 and p2
      ctx.save();
      {
        ctx.globalAlpha = 0.1;
        // ctx.strokeStyle = this.titanBlurPalette.getNextColor();
        // ctx.strokeStyle = this.yellowOrangePalette.getNextColor();
        ctx.strokeStyle = 'rgba(0, 250, 190, 0.1)'; // cyan
        ctx.lineWidth = 1;
        this.whiteCircleStats = this.drawArcPath(ctx, p2, p4);

        // add some pink
        // ctx.lineWidth = 2;
        // ctx.strokeStyle = "rgba(255, 200, 230, 0.25)";
        // this.drawArcPath(ctx, p2, p4);
        // ctx.strokeStyle = "rgb(16, 12, 23)"; // violet black line through p2
        // ctx.lineWidth = 4;
        // this.drawLineV(p2.getX(), p2.getY());
      }
      ctx.restore();

      // draw green circles at each particle
      ctx.save();
      {
        ctx.fillStyle = "green";
        ctx.globalAlpha = 0.9;
        ctx.globalCompositeOperation = 'color-dodge'; 
        for (let i = 0; i < particles.length - 1; i++) { // excludes 'tiny' particle which is the last one
          const p = particles[i];
          ctx.beginPath();
          ctx.ellipse(p.getX(), p.getY(), 5, 2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();

      // DEBUG: draw particle number at each particle
      if (false) {
        ctx.save();
        {
          ctx.globalAlpha = 0.2;
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            ctx.fillStyle = p.getColor();
            ctx.font = "18px monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            // ctx.beginPath();
            // ctx.ellipse(p.getX(), p.getY(), 2, 1, 0, 0, Math.PI * 2);
            // ctx.fill();
            ctx.fillText('' + i, p.getX(), p.getY() - 10);
          }
        }
        ctx.restore();
      }

      // ================================================================================================
      // Draw the offscreen canvas onto the display canvas in pieces.
      // Remember to scale up the particle positions since drawImage is not
      // affected by the earlier ctx.scale() that we applied to the offscreen context.

      const sliceWidth1 = Math.round(this.whiteCircleStats.radius /3  * this.totalScale); // 500
      const sliceWidth2 = Math.round(this.blackCircleStats.radius /4  * this.totalScale); // 200

      // draw normally 
      this.ctxDisplay.globalAlpha = 1.0; // draw the offscreen canvas at full opacity
      this.ctxDisplay.drawImage(this.offscreenCanvas,
        Math.round((this.whiteCircleStats.mx - this.whiteCircleStats.radius) * this.totalScale), 0, sliceWidth1, this.canvasH,
        Math.round((p2.getX()) * this.totalScale), 0, sliceWidth1, this.canvasH
      );
      // draw normally 
      this.ctxDisplay.globalAlpha = .2; // draw the offscreen canvas at full opacity
      // this.ctxDisplay.globalCompositeOperation = 'soft-light'; // hard-light is nice
      this.ctxDisplay.drawImage(this.offscreenCanvas,
        Math.round((p4.getX() - this.whiteCircleStats.radius) * this.totalScale), 0, sliceWidth1, this.canvasH,
        Math.round((p3.getX()) * this.totalScale), 0, sliceWidth1*0.25, this.canvasH
      );

      // bg rect
      this.ctxDisplay.globalAlpha = 0.03;
      this.ctxDisplay.fillStyle = "rgb(100, 120, 100)";
      // this.ctxDisplay.globalCompositeOperation = 'difference'; // hard-light is nice
      this.ctxDisplay.fillRect(Math.round((p2.getX()) * this.totalScale), 0, 2, this.canvasH);

      // draw high contrast
      this.ctxDisplay.globalAlpha = 0.82;
      // this.ctxDisplay.globalCompositeOperation = 'difference'; // hard-light is nice
      this.ctxDisplay.drawImage(this.offscreenCanvas,
        Math.round((this.blackCircleStats.mx) * this.totalScale), 0, sliceWidth2, this.canvasH,
        Math.round((p3.getX()) * this.totalScale), 0, 50, this.canvasH
      );

      // border line 
      // this.ctxDisplay.globalAlpha = 1.0; // draw the offscreen canvas at full opacity
      // this.ctxDisplay.strokeStyle = "rgb(255, 0, 0)";
      // this.ctxDisplay.globalCompositeOperation = 'difference'; // hard-light is nice
      // this.ctxDisplay.beginPath();
      // this.ctxDisplay.lineWidth = 2;
      // this.ctxDisplay.moveTo(p3.getX() * this.totalScale, 0);
      // this.ctxDisplay.lineTo(p3.getX() * this.totalScale, this.canvasH);
      // this.ctxDisplay.stroke();

      this.ctxDisplay.globalCompositeOperation = 'source-over'; // reset to default

      // DEBUG: draw slices into separate canvases appended to document
      if (false)
      {
        let row = document.getElementById('debug-slice-row');
        if (!row) {
          row = document.createElement('div');
          row.id = 'debug-slice-row';
          row.style.cssText = 'display:flex;flex-direction:row;gap:8px;font-family:monospace;font-size:11px;color:#fff;background:#111;padding:4px;';
          document.body.appendChild(row);
        }
        const debugSlices = [
          { id: 'debug-slice1', label: 'slice1', sx: Math.round(p4.getX() * this.totalScale), sw: sliceWidth1 },
          { id: 'debug-slice2', label: 'slice2', sx: Math.round(p2.getX() * this.totalScale), sw: sliceWidth2 },
        ];
        for (const { id, label, sx, sw } of debugSlices) {
          let wrapper = document.getElementById(id + '-wrapper');
          if (!wrapper) {
            wrapper = document.createElement('div');
            wrapper.id = id + '-wrapper';
            const lbl = document.createElement('div');
            lbl.textContent = label;
            wrapper.appendChild(lbl);
            const c = document.createElement('canvas');
            c.id = id;
            c.style.cssText = 'display:block;border:1px solid #555;';
            wrapper.appendChild(c);
            row.appendChild(wrapper);
          }
          const c = document.getElementById(id);
          c.width = sw;
          c.height = this.canvasH;
          c.getContext('2d').drawImage(this.offscreenCanvas, sx, 0, sw, this.canvasH, 0, 0, sw, this.canvasH);
        }
      }
      // end DEBUG

      ctx.restore();
    }

    drawArcPath(ctx, p1, p2) {
      // compute midpoint and radius from p1 and p2
      const x1 = p1.getX(), y1 = p1.getY();
      const x2 = p2.getX(), y2 = p2.getY();
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const radius = Math.hypot(x2 - x1, y2 - y1) / 2;
      ctx.beginPath();
      ctx.arc(mx, my, radius, 0, Math.PI * 2);
      ctx.stroke();
      return { mx, my, radius };
    }

    // ============================================================
    // Draw a vertical line from top to bottom of canvas through point (x, y)
    drawLineV(x, y) {
      this.ctx.beginPath();
      this.ctx.moveTo(x, 0);
      this.ctx.lineTo(x, this.simHeight);
      this.ctx.stroke();
    }

    drawLineH(x, y) {
      this.ctx.beginPath();
      this.ctx.moveTo(0, y);
      this.ctx.lineTo(this.simWidth, y);
      this.ctx.stroke();
    }

    clear() {
      // Draw a filled rectangle that covers the entire canvas
      this.ctx.fillStyle = "black";
      this.ctx.clearRect(0, 0, this.simWidth, this.simHeight);  // will scale to fill the high-DPI canvas
    }
  }

  async function loadAndRunSimulation() {
    try {
      const canvas = Page.createCanvas16x9(window.innerWidth, window.innerHeight, 'sim', true);

      const engine = new PhysicsEngine();
      engine.setDimensions(1651, 929); //!!!  16x9 but smaller size than 1990, 1119
      engine.detectCollisions = false;
      engine.timeStep = 0.23;

      const model = new Model();
      model.parseConfig(modelJSON);
      model.centerAt(engine.getWidth() / 2.2, engine.getHeight() / 2); //!!! center in the physics space, not DPI or screen

      engine.addModel(model.getParticles(), model.getSprings(), model.getEnvironment());

      const renderer = new RenderVerticals(engine, canvas);
      await renderer.init(); // load images for colors, textures, etc.
      renderer.bgColor = 'rgb(220, 0, 20)';
      renderer.opacity = 0.05;
      renderer.clearBG = false;
      renderer.clear();

      // Add a little randomness to one particle position
      // engine.particles[3].pos = new Vector2D(300 + (Math.random() * 200), 300 + (Math.random() * 200));
      // engine.particles[3].color = 'rgba(10, 0, 10, .6)'; // fade black

      const mouseHandler = new MouseHandler(canvas, engine, renderer);
      mouseHandler.hideCursorAfterDelay();

      const animationLoop = new AnimationLoop(() => {
        engine.step();
        renderer.render();
      });
      animationLoop.start();

      Page.setupKeyEvents(canvas, animationLoop, 'cassini2E_1_Moon_2');

      console.log('Simulation started successfully!');
    } catch (error) {
      console.error('Failed to initialize simulation:', error);
    }
  }

  loadAndRunSimulation();

</script>

</html>
