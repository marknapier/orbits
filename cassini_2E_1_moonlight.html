 Dominant colors are rust red, bright green. There is no spring connecting the first particle,
 which draws the dark violet circle, to the second particle. That allows the dark violet circle
 to expand to fill the vertical height of the screen and interact more freely with the vertical
 green line. Added a tiny particle to the massive "agitator" particle, creating a small orbiting 
 circle around the agitator. -->

  export default class RenderVerticals extends RenderSimple {
    // Configurable options
    bgColor = "rgb(60,0,0)";          // background color
    opacity = 0.2;                      // alpha for all paint operations
    clearBG = false;                     // if false, leaves motion trails
    violetColors = ["rgb(2, 2, 10)", "rgb(10, 3, 20)", "rgb(15, 5, 15)", "rgb(5, 0, 9)"];

    constructor(sim, canvas) {
      super(sim, canvas);
      this.titanBlurPalette = null; // colors will be loaded in init()
      this.yellowGreenPalette = null;
      this.yellowOrangePalette = null;
      this.halfPI = Math.PI / 2;
      this.quarterPI = Math.PI / 4;

      // High-DPI monitors, such as Retina displays, can have 2 or 3 times the pixel density of standard displays. 
      // To ensure our canvas looks crisp on these displays, we scale it up proportionally to the device pixel ratio. 
      // (see Page.createCanvas()). Here we scale up the drawing context so that our drawing commands work in 
      // the original coordinate space, but render a larger image.
      // this.dpiRatio = window.devicePixelRatio || 1;
      // this.ctx.scale(this.dpiRatio, this.dpiRatio); // Scale context for high-DPI displays




      this.dpiRatio = RenderSimple.getCanvasDPIRatio(this.canvas);

      //!!! get the screen to physics ratio
      this.canvasScreenSize = RenderSimple.getCanvasScreenSize(this.canvas);
      this.canvasScreenToSimRatioH = this.canvasScreenSize.height / sim.getHeight();

      // The final amount we'll scale by, including the DPI ratio and the screen-to-physics ratio.
      this.totalScale = this.dpiRatio * this.canvasScreenToSimRatioH;

      // Make an offscreen canvas for drawing - will be copied to display canvas in parts
      this.offscreenCanvas = Page.createOffscreenCanvasDPI(this.canvasScreenSize.width, this.canvasScreenSize.height, 'offscreen');
      // document.body.appendChild(this.offscreenCanvas); // debug - show the offscreen canvas on the page

      // this.ctx will draw to the offscreen canvas.
      this.ctxDisplay = this.ctx; // save the on-screen context
      this.ctx = this.offscreenCanvas.getContext('2d'); // off screen context

      // Scale the offscreen context to fit the high pixel density and the screen-to-physics ratio.
      this.ctx.scale(this.totalScale, this.totalScale);

      // save some dimensions for later use
      this.simWidth = sim.getWidth();    // physics units, need to be scaled up to fit full-sized canvas
      this.simHeight = sim.getHeight();
      this.canvasH = this.offscreenCanvas.height;    // actual pixels, no need to scale when using these
      this.canvasW = this.offscreenCanvas.width;



      // // canvas for drawing, will be copied to display canvas in parts
      // this.offscreenCanvas = document.createElement('canvas');
      // this.offscreenCanvas.width = this.canvas.width;
      // this.offscreenCanvas.height = this.canvas.height;
      // this.offscreenCanvas.id = 'offscreenCanvas';
      // // document.body.appendChild(this.offscreenCanvas); // debug

      // this.ctxDisplay = this.ctx; // save the on-screen context
      // this.ctx = this.offscreenCanvas.getContext('2d'); // off screen context
      // // this.ctx.scale(this.dpiRatio, this.dpiRatio); // Scale context for high-DPI displays, see comment in ctor

    }

    setParticles(particles) {
      this.particles = particles ?? [];
    }

    async init() {
      this.titanBlurPalette = await ColorPalette.createFromImage('./images/titan_blur_gray.jpg');
      this.yellowGreenPalette = await ColorPalette.createFromImage('./images/yellow_green_gradient_hc.png');
      this.yellowOrangePalette = await ColorPalette.createFromImage('./images/yellow_orange_gradient.png');
    }

    // ============================================================
    // Render the physics simulation into the canvas
    render() {
      const ctx = this.ctx;
      const w = this.simWidth; // may be scaled for high-DPI canvas
      const h = this.simHeight; // may be scaled for high-DPI canvas

      // Clear bg if configured to do so, with a low alpha to create motion trails
      if (this.clearBG) {
        ctx.save();
        ctx.globalAlpha = 0.1;
        ctx.fillStyle = this.bgColor;
        ctx.fillRect(0, 0, this.simWidth, this.simHeight);
        ctx.restore();
      }

      // Set a constant alpha composite for subsequent drawing
      ctx.save();
      ctx.globalAlpha = this.opacity;

      const particles = this.particles;

      const p0 = particles[0]; // violet 0 - 1, 0 is fixed
      const p1 = particles[1]; // spring to 2
      const p2 = particles[2]; // spring to 3
      const p3 = particles[3];
      const p4 = particles[4]; // agitator
      // const p5 = particles[5]; // tiny

      const radius1 = Particle.distance(p0, p1);
      const radius2 = Particle.distance(p1, p2);
      const radius3 = Particle.distance(p2, p3);
      const radius4 = Particle.distance(p3, p0);

      // ------------------------------------------------------------------------------------------------
      // Draw a circle for each particle pair, using the distance between particles as the radius.
      // ------------------------------------------------------------------------------------------------

      // Dark violet circle p0 - p1
      // Make a 0-1 value that represents the radius length relative to the canvas height
      const radiusPercent = Math.max(Math.min(radius1 / this.simHeight, 1), 0.1);
      ctx.save();
      {
        ctx.globalAlpha = 0.1;
        ctx.strokeStyle = this.violetColors[(radiusPercent * 3) | 0];
        ctx.lineWidth = 15 * radiusPercent;
        this.drawArcPath(ctx, p0, p1);
        // ctx.strokeStyle = "rgb(16, 12, 23)"; // violet black line through p0
        // ctx.lineWidth = 4;
        // this.drawLineV(p0.getX(), p0.getY());
      }
      ctx.restore();

      // draw a whitish grayish circle whose edges pass through p1 and p2
      ctx.save();
      {
        ctx.globalAlpha = 0.05;
        ctx.strokeStyle = this.titanBlurPalette.getNextColor();
        // ctx.strokeStyle = this.yellowOrangePalette.getNextColor();
        ctx.lineWidth = 2;
        this.drawArcPath(ctx, p2, p4);
        ctx.strokeStyle = "rgb(16, 12, 23)"; // violet black line through p2
        ctx.lineWidth = 4;
        this.drawLineV(p2.getX(), p2.getY());
      }
      ctx.restore();

      // // draw a ??? circle whose edges pass through p2 and p3
      // ctx.save();
      // {
      //   ctx.globalAlpha = 0.2;
      //   ctx.strokeStyle = "#FF00FF"; // magenta
      //   ctx.lineWidth = 2;
      //   this.drawArcPath(ctx, p2, p3);
      //   // greenish vertical
      //   // ctx.strokeStyle = this.yellowGreenPalette.getNextColor();
      //   // ctx.strokeStyle = "rgb(144, 200, 151)";
      //   ctx.strokeStyle = "rgba(237, 30, 30, 0.1)"; // bright red with low opacity
      //   this.drawLineV(p3.getX(), p3.getY());
      // }
      // ctx.restore();

      // // draw a teal circle whose edges pass through p2 and p3
      // ctx.save();
      // {
      //   ctx.globalAlpha = 0.2;
      //   ctx.strokeStyle = "rgb(78, 188, 155)";  // out of gamut for print: "rgb(60, 200, 160)";
      //   ctx.lineWidth = 2;
      //   this.drawArcPath(ctx, p1, p3);
      // }
      // ctx.restore();

      // // light blue circle with thick border at p2
      // const gradientPercent = Math.max(Math.min(radius3 / this.simHeight, 1), 0.1);
      // ctx.save();
      // {
      //   ctx.globalAlpha = 0.2;
      //   ctx.beginPath();
      //   ctx.arc(p2.getX(), p2.getY(), Math.max((radius3 / 2) - 20, 0), 0, Math.PI * 2);
      //   ctx.strokeStyle = `rgb(1, 193, 193)`;
      //   ctx.lineWidth = 4;
      //   ctx.stroke();
      //   // dark point at bottom of circle
      //   ctx.beginPath();
      //   ctx.arc(p2.getX(), p2.getY(), Math.max((radius3 / 2) - 18, 0), 1.4, 1.7);
      //   ctx.strokeStyle = `rgb(50, 90, 90)`;
      //   ctx.lineWidth = 3;
      //   ctx.stroke();
      //   // light point at top of circle
      //   ctx.beginPath();
      //   ctx.arc(p2.getX(), p2.getY(), Math.max((radius3 / 2) - 18, 0), -this.halfPI, -1.4);
      //   ctx.strokeStyle = `rgb(180, 200, 150)`;
      //   ctx.lineWidth = 3;
      //   ctx.stroke();
      // }
      // ctx.restore();

      // // Orange circle around p3, and vertical line through p2
      // ctx.save();
      // {
      //   ctx.globalAlpha = 0.1;
      //   ctx.strokeStyle = this.yellowOrangePalette.getNextColor();
      //   ctx.globalAlpha = 0.3;
      //   ctx.lineWidth = 4;
      //   this.drawArcPath(ctx, p2, p3);
      //   this.drawLineV(p2.getX(), p2.getY());
      // }
      // ctx.restore();

      // // Green line at agitator
      // ctx.save();
      // {
      //   ctx.globalAlpha = 0.5;
      //   ctx.strokeStyle = this.yellowGreenPalette.getNextColor();
      //   ctx.lineWidth = 3;
      //   ctx.setLineDash([250, 1]);
      //   this.drawLineV(p4.getX(), p4.getY());
      //   ctx.setLineDash([]);
      // }
      // ctx.restore();

      // // draw a ??? circle whose edges pass through p2 and p3
      // ctx.save();
      // {
      //   ctx.globalAlpha = 0.2;
      //   ctx.strokeStyle = "rgb(120, 200, 40)";
      //   ctx.lineWidth = 1;
      //   this.drawArcPath(ctx, p4, p5);
      // }
      // ctx.restore();

      // draw green circles at each particle
      ctx.save();
      {
        ctx.fillStyle = "green";
        ctx.globalAlpha = 0.9;
        for (let i = 0; i < particles.length - 1; i++) { // excludes 'tiny' particle which is the last one
          const p = particles[i];
          ctx.beginPath();
          ctx.ellipse(p.getX(), p.getY(), 2, 1, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();

      // ================================================================================================
      // Draw the offscreen canvas onto the display canvas in pieces.

      const sliceWidth1 = Math.round(150 * this.totalScale);
      const sliceWidth2 = Math.round(150 * this.totalScale);

      this.ctxDisplay.globalAlpha = 1.0; // draw the offscreen canvas at full opacity

      this.ctxDisplay.drawImage(this.offscreenCanvas,
        Math.round((p0.getX()) * this.totalScale), 0, sliceWidth1, this.canvasH,
        Math.round(p1.getX() * this.totalScale), 0, sliceWidth1, this.canvasH
      );
      // this.ctxDisplay.globalAlpha = 0.15; // draw the offscreen canvas at full opacity
      // this.ctxDisplay.drawImage(this.offscreenCanvas,
      //   Math.round((p4.getX()) * this.totalScale), 0, sliceWidth2, this.canvasH,
      //   Math.round(p3.getX() * this.totalScale), 0, sliceWidth2, this.canvasH
      // );
      this.ctxDisplay.globalAlpha = 0.5; // draw the offscreen canvas at full opacity
      this.ctxDisplay.globalCompositeOperation = 'hard-light'; // hard-light is nice 
      this.ctxDisplay.drawImage(this.offscreenCanvas,
        Math.round((p4.getX()) * this.totalScale), 0, sliceWidth2, this.canvasH,
        Math.round(p3.getX() * this.totalScale), 0, sliceWidth2, this.canvasH
      );

      this.ctxDisplay.globalCompositeOperation = 'source-over'; // reset to default

      ctx.restore();
    }

    drawArcPath(ctx, p1, p2) {
      // compute midpoint and radius from p1 and p2
      const x1 = p1.getX(), y1 = p1.getY();
      const x2 = p2.getX(), y2 = p2.getY();
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const radius = Math.hypot(x2 - x1, y2 - y1) / 2;
      ctx.beginPath();
      ctx.arc(mx, my, radius, 0, Math.PI * 2);
      ctx.stroke();

    }

    // ============================================================
    // Draw a vertical line from top to bottom of canvas through point (x, y)
    drawLineV(x, y) {
      this.ctx.beginPath();
      this.ctx.moveTo(x, 0);
      this.ctx.lineTo(x, this.simHeight);
      this.ctx.stroke();
    }

    drawLineH(x, y) {
      this.ctx.beginPath();
      this.ctx.moveTo(0, y);
      this.ctx.lineTo(this.simWidth, y);
      this.ctx.stroke();
    }

    clear() {
      // Draw a filled rectangle that covers the entire canvas
      this.ctx.fillStyle = "black";
      this.ctx.fillRect(0, 0, this.simWidth, this.simHeight);
    }
  }

  async function loadAndRunSimulation() {
    try {
      const canvas = Page.createCanvas16x9(window.innerWidth, window.innerHeight);

      const engine = new PhysicsEngine();
      engine.setDimensions(1651, 929); //!!!  16x9 but smaller size than 1990, 1119
      engine.detectCollisions = false;
      engine.timeStep = 0.23;

      const model = new Model();
      model.parseConfig(modelJSON);
      model.centerAt(engine.getWidth() / 2.2, engine.getHeight() / 2); //!!! center in the physics space, not DPI or screen

      engine.addModel(model.getParticles(), model.getSprings(), model.getEnvironment());

      const renderer = new RenderVerticals(engine, canvas);
      await renderer.init(); // load images for colors, textures, etc.
      renderer.bgColor = 'rgb(20, 0, 20)';
      renderer.opacity = 0.05;
      renderer.clearBG = false;
      renderer.clear();

      // Add a little randomness to one particle position
      // engine.particles[3].pos = new Vector2D(300 + (Math.random() * 200), 300 + (Math.random() * 200));
      // engine.particles[3].color = 'rgba(10, 0, 10, .6)'; // fade black

      const mouseHandler = new MouseHandler(canvas, engine, renderer);
      mouseHandler.hideCursorAfterDelay();

      const animationLoop = new AnimationLoop(() => {
        engine.step();
        renderer.render();
      });
      animationLoop.start();

      Page.setupKeyEvents(canvas, animationLoop, 'cassini_2E_1_moonlight');

      console.log('Simulation started successfully!');
    } catch (error) {
      console.error('Failed to initialize simulation:', error);
    }
  }

  loadAndRunSimulation();
