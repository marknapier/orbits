<!doctype html>
<html>
<!-- 
Composited couch with moving plaid pattern, on a wooden floor against changing striped wallpaper.
 -->

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Couch</title>
  <link rel="stylesheet" href="./styles/full_viewport_canvas.css">
</head>

<body>
  <button class="btn-back" onclick="history.back()" aria-label="Go back">&#8249;</button>
  <!-- Canvas will be inserted here -->
</body>

<script type="module">
  import PhysicsEngine from './js/physics2D/PhysicsEngine.js';
  import Vector2D from './js/physics2D/Vector2D.js';
  import MouseHandler from './js/app/MouseHandler.js';
  import AnimationLoop from './js/app/AnimationLoop.js';
  import Model from './js/app/Model.js';
  import Page from './js/app/Page.js'
  import Particle from './js/physics2D/Particle.js';
  import ColorPalette from './js/app/ColorPalette.js';
  import RenderSimple from './js/app/RenderSimple.js'
  import MovingImagePlaid2 from '../js/app/MovingImagePlaid2.js';
  import MovingImageStripes from '../js/app/MovingImageStripes.js';
  import ImageLoader from '../js/app/ImageLoader.js';
  import Oscillator from '../js/app/Oscillator.js';

  function makePlaidConfig(width) {
    return [
      { // background stripe is full width, and has no oscWidth so it always fills full width
        widthBase: width,
        position: width / 2,
        darkColor: [25, 45, 22],
        lightColor: [220, 250, 250],
        oscColor: { cycleDuration: 300, type: 'sin', phase: Math.PI * 0.2 },
      },
      {
        widthBase: width * 0.25,
        widthDelta: width * 0.20,
        position: width * 0.25,
        darkColor: [70, 128, 132],
        lightColor: [192, 226, 228],
        oscWidth: { cycleDuration: 325, type: 'sin', phase: 0 },
        oscColor: { cycleDuration: 225, type: 'sin', phase: Math.PI * 0.7 },
        alpha: 0.65,
      },
      {
        widthBase: width * 0.20,
        widthDelta: width * 0.10,
        position: width * 0.25,
        darkColor: [255, 128, 132],
        lightColor: [255, 121, 13],
        oscWidth: { cycleDuration: 400, type: 'sin', phase: 0 },
        oscColor: { cycleDuration: 260, type: 'sin', phase: Math.PI * 0.8 },
        alpha: 0.65,
        alpha: 0.6,
      },
      {
        widthBase: width * 0.10,
        widthDelta: width * 0.08,
        position: width * 0.70,
        darkColor: [218, 188, 88],
        lightColor: [208, 200, 184],
        oscWidth: { cycleDuration: 120, type: 'cos', phase: 0 },
        oscColor: { cycleDuration: 50, type: 'sin', phase: Math.PI * 1.3 },
        alpha: 0.65,
      },
      {
        widthBase: width * 0.10,
        widthDelta: width * 0.08,
        position: width * 0.80,
        darkColor: [218, 188, 88],
        lightColor: [208, 200, 184],
        oscWidth: { cycleDuration: 130, type: 'cos', phase: 0 },
        oscColor: { cycleDuration: 60, type: 'sin', phase: Math.PI * 1.3 },
        alpha: 0.65,
      },
    ];
  }

  function makeStripeConfig(width) {
    return [
      { // background stripe is full width, and has no oscWidth so it always fills full width
        widthBase: width,
        position: width / 2,
        darkColor: [25, 45, 22],
        lightColor: [220, 250, 250],
        oscColor: { cycleDuration: 360, type: 'sin', phase: Math.PI * 0.2 },
      },
      {
        widthBase: width * 0.25,
        widthDelta: width * 0.20,
        position: width * 0.25,
        darkColor: [70, 128, 132],
        lightColor: [192, 226, 228],
        oscWidth: { cycleDuration: 320, type: 'sin', phase: 0 },
        oscColor: { cycleDuration: 300, type: 'sin', phase: Math.PI * 0.7 },
        alpha: 0.65,
      },
      {
        widthBase: width * 0.20,
        widthDelta: width * 0.10,
        position: width * 0.25,
        darkColor: [255, 128, 132],
        lightColor: [255, 121, 13],
        oscWidth: { cycleDuration: 390, type: 'sin', phase: 0 },
        oscColor: { cycleDuration: 240, type: 'sin', phase: Math.PI * 0.8 },
        alpha: 0.65,
        alpha: 0.6,
      },
      {
        widthBase: width * 0.10,
        widthDelta: width * 0.08,
        position: width * 0.70,
        darkColor: [218, 188, 88],
        lightColor: [208, 200, 184],
        oscWidth: { cycleDuration: 100, type: 'cos', phase: 0 },
        oscColor: { cycleDuration: 40, type: 'sin', phase: Math.PI * 1.3 },
        alpha: 0.65,
      },
      {
        widthBase: width * 0.10,
        widthDelta: width * 0.08,
        position: width * 0.80,
        darkColor: [218, 188, 88],
        lightColor: [208, 200, 184],
        oscWidth: { cycleDuration: 130, type: 'cos', phase: 0 },
        oscColor: { cycleDuration: 30, type: 'sin', phase: Math.PI * 1.3 },
        alpha: 0.65,
      },
    ];
  }

  class RenderCouchWithDots extends RenderSimple {
    constructor(sim, canvas) {
      super(sim, canvas);
      this.bgColor = 'rgb(250, 250, 250)';
      this.about700pixels = Math.round(this.canvas.width * 0.365);
      this.about200pixels = Math.round(this.canvas.width * 0.104);
      this.movingImagePlaid2 = new MovingImagePlaid2(this.about200pixels, this.about200pixels, makePlaidConfig(this.about200pixels));
      this.movingImageStripes = new MovingImageStripes(this.about200pixels, this.about200pixels, makeStripeConfig(this.about200pixels));
      // Oscillates the stripe and plaid pattern's scale: 1.0 (full size) down to 0.5 (half size) and back
      this.plaidScaleOsc = new Oscillator(0, 'cos', 0, 1800);
      this.stripeScaleOsc = new Oscillator(0, 'sin', 0, 4800);
      this.floorTop = Math.floor((this.height * 0.80) * this.totalScale);
      this.floorH = Math.floor((this.height * 0.21) * this.totalScale);
      this.baseboardH = Math.floor((this.height * 0.08) * this.totalScale);

      // In this artwork, the physics sim is a no-op (there is no physics interaction happening here), 
      // so the scale is just to match potential high-DPI displays. 
      this.ctx.scale(this.totalScale, this.totalScale);
    }

    createCouchBorderCanvas(spread = 8, color = 'white') {
      const canvas = document.createElement('canvas');
      canvas.width = this.canvas.width;
      canvas.height = this.canvas.height;
      const ctx = canvas.getContext('2d');

      const x = this.width * 0.1;
      const y = this.height * 0.2;
      const w = this.width * 0.8;
      const h = this.height * 0.75;

      ctx.shadowColor = color;
      ctx.shadowBlur = 0;
      for (const [dx, dy] of [[spread, 0], [-spread, 0], [0, spread], [0, -spread]]) {
        ctx.shadowOffsetX = dx;
        ctx.shadowOffsetY = dy;
        ctx.drawImage(this.couchImage, x, y, w, h);
      }

      // Punch out the image's own pixels, leaving only the border ring
      ctx.shadowColor = 'transparent';
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.drawImage(this.couchImage, x, y, w, h);

      return canvas;
    }

    async init() {
      // this.couchImage = await ImageLoader.loadImage('../images/brown_leather_couch.png');
      this.couchImage = await ImageLoader.loadImage('../images/mid_century_modern_sofa_t.png');
      this.couchShadow = await ImageLoader.loadImage('../images/mid_century_modern_sofa_shadow.png');
      this.couchShadowRight = await ImageLoader.loadImage('../images/couch_wall_shadow_right.png');
      this.wallShadow = await ImageLoader.loadImage('../images/couch_wall_shadow.png');
      this.floorImage = await ImageLoader.loadImage('../images/wood_floor_light_large_p.jpg');
      this.baseboardImage = await ImageLoader.loadImage('../images/baseboard_white.png');
      this.throwPillowImage = await ImageLoader.loadImage('../images/throw_pillow_striped.png');
      this.yellowGreenPalette = await ColorPalette.createFromImage('../images/eye_closeup_green_extract.jpg');

      this.canvasBorder = this.createCouchBorderCanvas(5, 'white');

      // Reusable canvas for tinting the border each frame
      this.canvasBorderTinted = document.createElement('canvas');
      this.canvasBorderTinted.width = this.canvas.width;
      this.canvasBorderTinted.height = this.canvas.height;
      this.ctxBorderTinted = this.canvasBorderTinted.getContext('2d');

      // Create off-screen canvas for couch with pattern - couch image acts as mask for the plaid pattern.
      this.canvasCouch = document.createElement('canvas');
      this.canvasCouch.width = this.canvas.width;
      this.canvasCouch.height = this.canvas.height;
      this.ctxCouch = this.canvasCouch.getContext('2d');
      this.ctxCouch.drawImage(this.couchImage, this.canvas.width * 0.1, this.canvas.height * 0.2, this.canvas.width * 0.8, this.canvas.height * 0.75);

      // Create off-screen canvas for background
      this.canvasBackground = document.createElement('canvas');
      this.canvasBackground.width = this.canvas.width;
      this.canvasBackground.height = this.canvas.height;
      this.ctxBackground = this.canvasBackground.getContext('2d');
    }

    render() {
      // Update the moving images
      this.movingImagePlaid2.step();   // overlay plaid on the couch
      this.movingImageStripes.step();  // background wallpaper

      // Background layer: wallpaper pattern
      const stripePattern = this.ctxBackground.createPattern(this.movingImageStripes.canvas, 'repeat');
      const stripeScale = 0.65 + 0.35 * this.stripeScaleOsc.getValue();  // range from 0.3 to 1.0
      stripePattern.setTransform(new DOMMatrix().scale(stripeScale, stripeScale));
      this.ctxBackground.globalAlpha = 1.0;
      this.ctxBackground.globalCompositeOperation = 'source-over';
      this.ctxBackground.fillStyle = stripePattern;
      this.ctxBackground.fillRect(0, 0, this.canvas.width, this.canvas.height);

      // Background layer: floor and baseboard
      this.ctxBackground.drawImage(this.floorImage, 0, this.floorTop, this.canvas.width, this.floorH);
      this.ctxBackground.drawImage(this.baseboardImage, 0, this.floorTop - this.baseboardH, this.canvas.width, this.baseboardH);

      // Background layer: light and shadow on wall
      // this.ctxBackground.globalAlpha = 0.95;
      // this.ctxBackground.globalCompositeOperation = 'soft-light';
      // this.ctxBackground.drawImage(this.wallShadow, 0, 0, this.canvas.width, this.canvas.height);

      // Background layer: shadow to right of couch, on wall and floor
      this.ctxBackground.globalAlpha = 0.25;
      this.ctxBackground.globalCompositeOperation = 'source-over';
      this.ctxBackground.drawImage(this.couchShadowRight, this.canvas.width * 0.77, this.canvas.height * 0.23, this.canvas.width * 0.25, this.canvas.height * 0.75);

      // Draw plaid pattern onto couch
      // Smoothly scale the pattern down to half size and back over a long cycle, to create a finer plaid over time.
      const plaidPattern = this.ctxCouch.createPattern(this.movingImagePlaid2.canvas, 'repeat');
      const plaidScale = 0.75 + 0.25 * this.plaidScaleOsc.getValue();  // range from 0.5 to 1.0
      plaidPattern.setTransform(new DOMMatrix().scale(plaidScale, plaidScale));
      this.ctxCouch.globalAlpha = 0.1;
      this.ctxCouch.globalCompositeOperation = 'source-atop';
      this.ctxCouch.fillStyle = plaidPattern;
      this.ctxCouch.fillRect(0, 0, this.canvas.width, this.canvas.height);

      // Main layer: background + couch with pattern overlayed
      // clear
      this.ctx.clearRect(0, 0, this.width * this.totalScale, this.height * this.totalScale);
      // draw background (wall and floor)
      this.ctx.globalCompositeOperation = 'source-over';
      this.ctx.globalAlpha = 1.0;
      this.ctx.drawImage(this.canvasBackground, 0, 0, this.width * this.totalScale, this.height * this.totalScale);
      // draw plain couch with shadow underneath
      this.ctx.globalAlpha = 1.0;
      this.ctx.drawImage(this.couchShadow, this.width * this.totalScale * 0.1, this.height * this.totalScale * 0.2, this.width * this.totalScale * 0.8, this.height * this.totalScale * 0.75);
      this.ctx.drawImage(this.couchImage, this.width * this.totalScale * 0.1, this.height * this.totalScale * 0.2, this.width * this.totalScale * 0.8, this.height * this.totalScale * 0.75);
      // Set composite mode to overlay
      this.ctx.globalCompositeOperation = 'overlay';
      this.ctx.drawImage(this.canvasCouch, 0, 0, this.width * this.totalScale, this.height * this.totalScale);

      // pillow on couch
      this.ctx.globalCompositeOperation = 'source-over';
      this.ctx.drawImage(this.throwPillowImage, this.width * this.totalScale * 0.64, this.height * this.totalScale * 0.28, this.width * this.totalScale * 0.18, this.width * this.totalScale * 0.16);

      // light effect over entire scene
      this.ctx.globalAlpha = 0.7;
      this.ctx.globalCompositeOperation = 'soft-light';
      this.ctx.drawImage(this.wallShadow, 0, 0, this.canvas.width, this.canvas.height);

      // reset
      this.ctx.globalCompositeOperation = 'source-over';
    }
  }

  function pauseOscillators() {
    Oscillator.pauseAll();
  }
  function resumeOscillators() {
    Oscillator.resumeAll();
  }

  async function loadAndRunSimulation() {
    try {
      const canvas = Page.createCanvas16x9(window.innerWidth, window.innerHeight);

      // just a placeholder, not actually used. To simplify scaling, the 
      // physics engine dimensions are set to match the canvas dimensions.
      const engine = new PhysicsEngine();
      engine.setDimensions(canvas.width, canvas.height);

      const renderer = new RenderCouchWithDots(engine, canvas);
      await renderer.init();

      const mouseHandler = new MouseHandler(canvas, engine, renderer);
      mouseHandler.hideCursorAfterDelay();

      const animationLoop = new AnimationLoop(() => {
        engine.step();
        renderer.render();
      });
      animationLoop.start();

      Page.setupKeyEvents(canvas, animationLoop, 'perfect_couch');
      Page.onPause(() => pauseOscillators());
      Page.onResume(() => resumeOscillators());

      console.log('Simulation started successfully!');
    } catch (error) {
      console.error('Failed to initialize simulation:', error);
    }
  }

  loadAndRunSimulation();

</script>

</html>
